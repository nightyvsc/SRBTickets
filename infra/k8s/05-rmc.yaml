apiVersion: v1
kind: Service
metadata:
  name: rmc-svc
  namespace: srb
  labels:
    app: rmc
spec:
  ports:
  - name: health
    port: 8100
    targetPort: 8100
  selector:
    app: rmc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rmc
  namespace: srb
  labels:
    app: rmc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rmc
  template:
    metadata:
      labels:
        app: rmc
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: srb-role
                operator: In
                values:
                - business
                - rmc
      containers:
      - name: rmc
        image: srb-rmc:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: COMPONENT_NAME
          value: "rmc"
        - name: GT_RMC_HOST
          value: "gt-svc.srb.svc.cluster.local"
        - name: GT_RMC_PORT
          value: "5570"
        - name: PERSIST_HOST
          value: "persistence-svc.srb.svc.cluster.local"
        - name: PERSIST_PORT
          value: "5580"
        - name: HEALTH_PORT
          value: "8100"
        ports:
        - containerPort: 8100
          name: health
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
