apiVersion: v1
kind: Service
metadata:
  name: cockroachdb
  namespace: srb
  labels:
    app: cockroachdb
spec:
  publishNotReadyAddresses: true
  ports:
  - port: 26257
    targetPort: 26257
    name: grpc
  - port: 8080
    targetPort: 8080
    name: http
  clusterIP: None
  selector:
    app: cockroachdb
---
apiVersion: v1
kind: Service
metadata:
  name: cockroachdb-public
  namespace: srb
  labels:
    app: cockroachdb
spec:
  ports:
  - port: 26257
    targetPort: 26257
    name: grpc
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: cockroachdb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cockroachdb
  namespace: srb
spec:
  serviceName: cockroachdb
  replicas: 3
  selector:
    matchLabels:
      app: cockroachdb
  template:
    metadata:
      labels:
        app: cockroachdb
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - cockroachdb
              topologyKey: kubernetes.io/hostname
      containers:
      - name: cockroachdb
        image: cockroachdb/cockroach:v24.1.4
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1536Mi"
        ports:
        - containerPort: 26257
          name: grpc
        - containerPort: 8080
          name: http
        livenessProbe:
          httpGet:
            path: "/health"
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: "/health"
            port: http
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: "/health?ready=1"
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: datadir
          mountPath: /cockroach/cockroach-data
        command:
          - "/bin/bash"
          - "-ecx"
          - "exec /cockroach/cockroach start --insecure --advertise-host=$(hostname -f) --http-addr=0.0.0.0 --listen-addr=0.0.0.0 --join=cockroachdb-0.cockroachdb,cockroachdb-1.cockroachdb,cockroachdb-2.cockroachdb --cache=256Mi --max-sql-memory=256Mi"
  volumeClaimTemplates:
  - metadata:
      name: datadir
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cockroachdb-init
  namespace: srb
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: cockroachdb-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: cluster-init
        image: cockroachdb/cockroach:v24.1.4
        imagePullPolicy: IfNotPresent
        command:
          - "/bin/bash"
          - "-c"
          - |
            echo "Waiting for cockroachdb-0..."
            until /cockroach/cockroach init --insecure --host=cockroachdb-0.cockroachdb:26257 2>/dev/null || /cockroach/cockroach node status --insecure --host=cockroachdb-public:26257 >/dev/null 2>&1; do
              sleep 2
            done
            echo "Creating database srb..."
            /cockroach/cockroach sql --insecure --host=cockroachdb-public:26257 -e "CREATE DATABASE IF NOT EXISTS srb;"
            echo "Cluster initialized successfully."
